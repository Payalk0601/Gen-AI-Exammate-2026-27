# Start everything with:  docker compose up --build
# API  -> http://localhost:8000/docs      UI -> http://localhost:8501
# API keys come from your local .env file (compose reads it automatically).

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      KACHRACHECK_API_URL: http://api:8000
      KACHRACHECK_FEEDBACK: /feedback/feedback.jsonl
    volumes:
      - feedback:/feedback
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  feedback:
